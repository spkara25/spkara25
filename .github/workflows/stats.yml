name: Generate GitHub Stats

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensures the bot is allowed to push changes
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=spkara25&show_icons=true&theme=tokyonight&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=spkara25&layout=compact&theme=tokyonight&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
